{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขข้อมูลส่วนตัว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", sans-serif;
        }
        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 4px solid #e5e7eb;
        }
        .profile-img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-lg mx-auto p-8 mt-12 bg-white shadow-xl rounded-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">แก้ไขข้อมูลส่วนตัว</h1>

        <form method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
            {% csrf_token %}
            
            <!-- รูปโปรไฟล์ -->
            <div class="text-center mb-8">
                <label for="profile_picture">
                    <img src="{% if user.profile_picture %}{{ user.profile_picture.url }}{% else %}{% static 'images/default-profile.png' %}{% endif %}" 
                         alt="โปรไฟล์" class="profile-img mx-auto" id="profile-preview">
                </label>
                <input type="file" name="profile_picture" id="profile_picture" accept="image/*" onchange="previewProfileImage(event)" class="hidden">
                <p class="text-sm text-gray-500 mt-2">คลิกที่รูปเพื่อเปลี่ยนรูปโปรไฟล์</p>
            </div>

            <!-- ชื่อผู้ใช้ -->
            <div class="mb-6">
                <label for="username" class="block text-lg font-semibold text-gray-700 mb-2">ชื่อผู้ใช้</label>
                <input type="text" name="username" id="username" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" value="{{ user.username }}" required>
                <p class="error-message" id="username-error">กรุณากรอกชื่อผู้ใช้</p>
            </div>

            <!-- อีเมล -->
            <div class="mb-6">
                <label for="email" class="block text-lg font-semibold text-gray-700 mb-2">อีเมล</label>
                <input type="email" name="email" id="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" value="{{ user.email }}" required>
                <p class="error-message" id="email-error">รูปแบบอีเมลไม่ถูกต้อง</p>
            </div>

            <!-- เบอร์โทร -->
            <div class="mb-6">
                <label for="phone_number" class="block text-lg font-semibold text-gray-700 mb-2">เบอร์โทรศัพท์</label>
                <input type="tel" name="phone_number" id="phone_number" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" value="{{ user.phone_number }}">
                <p class="error-message" id="phone-error">กรุณากรอกเบอร์โทร 10 หลัก</p>
            </div>

            <div class="mb-6">
                <label for="address" class="block text-lg font-semibold text-gray-700 mb-2">ที่อยู่</label>
                <input type="text" name="address" id="address" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" value="{{ user.address }}">
                <p class="error-message" id="address-error">กรุณากรอกที่อยู่</p>
            </div>

            <!-- ปุ่มบันทึก -->
            <div class="text-center">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-8 rounded-lg">บันทึก</button>
                <a href="{% url 'home_user' %}" class="ml-4 text-gray-600 hover:text-gray-900 underline">ยกเลิก</a>
            </div>
        </form>
    </main>

    <script>
        function previewProfileImage(event) {
            const reader = new FileReader();
            const preview = document.getElementById('profile-preview');
            reader.onload = function () {
                preview.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function validateForm() {
            let isValid = true;

            // ตรวจสอบชื่อผู้ใช้
            const username = document.getElementById('username').value.trim();
            if (username === '') {
                document.getElementById('username-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('username-error').style.display = 'none';
            }

            // ตรวจสอบอีเมล
            const email = document.getElementById('email').value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('email-error').style.display = 'none';
            }

            // ตรวจสอบเบอร์โทรศัพท์
            const phone = document.getElementById('phone_number').value.trim();
            const phonePattern = /^[0-9]{10}$/;
            if (phone !== '' && !phonePattern.test(phone)) {
                document.getElementById('phone-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('phone-error').style.display = 'none';
            }

            // ตรวจสอบที่อยู่
            const address = document.getElementById('address').value.trim();
            if (address === '') {
                document.getElementById('address-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('address-error').style.display = 'none';
            }

            return isValid;
        }
    </script>

</body>
</html>
