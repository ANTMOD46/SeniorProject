{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <title>แก้ไขข้อมูลส่วนตัว</title>
    <style>
        * {
            font-family: "Kanit", serif;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-pink-50">
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-lg mx-auto p-6 mt-10 bg-white shadow-lg rounded-lg">
        <h1 class="text-3xl font-bold text-pink-600 mb-6 text-center">แก้ไขข้อมูลส่วนตัว</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- ฟิลด์สำหรับรูปโปรไฟล์ -->
            <div class="text-center mb-6">
                {% if user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" alt="โปรไฟล์" class="profile-img mx-auto mb-4">
                {% else %}
                    <img src="{% static 'images/default-profile.png' %}" alt="โปรไฟล์เริ่มต้น" class="profile-img mx-auto mb-4">
                {% endif %}
                <label for="profile_picture" class="block text-lg font-semibold text-gray-700 mb-2">อัปโหลดรูปโปรไฟล์</label>
                <input type="file" name="profile_picture" id="profile_picture" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500">
            </div>

            <!-- ฟิลด์สำหรับชื่อผู้ใช้ -->
            <div class="mb-6">
                <label for="username" class="block text-lg font-semibold text-gray-700 mb-2">ชื่อผู้ใช้</label>
                <input type="text" name="username" id="username" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" value="{{ user.username }}" required>
            </div>

            <!-- ฟิลด์สำหรับอีเมล -->
            <div class="mb-6">
                <label for="email" class="block text-lg font-semibold text-gray-700 mb-2">อีเมล</label>
                <input type="email" name="email" id="email" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" value="{{ user.email }}" required>
            </div>

            <!-- ฟิลด์สำหรับชื่อจริง -->
            <div class="mb-6">
                <label for="first_name" class="block text-lg font-semibold text-gray-700 mb-2">ชื่อจริง</label>
                <input type="text" name="first_name" id="first_name" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" value="{{ user.first_name }}">
            </div>

            <!-- ฟิลด์สำหรับนามสกุล -->
            <div class="mb-6">
                <label for="last_name" class="block text-lg font-semibold text-gray-700 mb-2">นามสกุล</label>
                <input type="text" name="last_name" id="last_name" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" value="{{ user.last_name }}">
            </div>

            <!-- ฟิลด์สำหรับเบอร์โทรศัพท์ -->
            <div class="mb-6">
                <label for="phone_number" class="block text-lg font-semibold text-gray-700 mb-2">เบอร์โทรศัพท์</label>
                <input type="tel" name="phone_number" id="phone_number" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" value="{{ user.profile.phone_number }}" placeholder="กรอกเบอร์โทรศัพท์" required>
            </div>

            <!-- ฟิลด์สำหรับที่อยู่ -->
            <div class="mb-6">
                <label for="address" class="block text-lg font-semibold text-gray-700 mb-2">ที่อยู่</label>
                <textarea name="address" id="address" rows="3" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" placeholder="กรอกที่อยู่ของคุณ">{{ user.profile.address }}</textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-8 rounded-md">บันทึกการเปลี่ยนแปลง</button>
                <a href="{% url 'home_user' %}" class="ml-4 text-gray-600 hover:underline">ยกเลิก</a>
            </div>
        </form>
    </main>
</body>

</html>
