{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }

        .logo-img {
            width: 60px;
            height: auto;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: block;
        }
    </style>
    <title>ลงประกาศใหม่</title>
</head>

<body class="bg-pink-50">
    <!-- Header Nav -->
    <header class="w-full bg-white border-b border-pink-200 shadow-lg z-50">
        <div class="flex items-center justify-between max-w-screen-xl mx-auto px-4 py-4">
            <!-- Left Section (Logo) -->
            <div class="flex items-center">
                <img class="logo-img object-cover rounded-full" src="{% static 'css/dist/Seniorproject/img/logo.png' %}" alt="Logo">
            </div>
            <!-- Right Section (User Name, Profile Image, Post Button, Hamburger) -->
            <div class="flex items-center space-x-6 ml-auto">
                <!-- Profile Image -->
                <img src="{% if user.profile_picture %}{{ user.profile_picture.url }}{% else %}{% static 'css/dist/Seniorproject/img/default-profile.png' %}{% endif %}" alt="Profile Image" class="profile-img">

                <!-- User Name -->
                <div class="flex items-center space-x-4">
                    <span class="text-lg font-semibold text-pink-500">{{ user.username }}</span>
                </div>

                <!-- Post Ad Button -->
                <a href="{% url 'post_ad' %}" class="text-white bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-md">
                    ลงประกาศ
                </a>

                <!-- Hamburger Button -->
                <div class="relative inline-block text-left">
                    <button id="hamburgerButton" class="flex items-center text-lg font-semibold text-pink-500 focus:outline-none">
                        <!-- Hamburger Icon -->
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="dropdownMenu" class="dropdown-menu absolute text-gray-700 pt-2 right-0 bg-white rounded-md shadow-lg w-48">
                        <a href="{% url 'home_user' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">หน้าแรก</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">ดูการแยกขยะ</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">เพิ่มการแยกขยะ</a>
                        <a href="{% url 'user_store' request.user.username %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">หน้าร้านของฉัน</a>
                        {% comment %} <a href="{% url 'rooms' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">แชท</a> {% endcomment %}
                        
                        {% if user.is_superuser %}
                        <a href="{% url 'admin_member_list' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">หน้าสมาชิกทั้งหมด</a>
                        {% endif %}

                        <a href="{% url 'profile_edit' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">ดูและแก้ไขข้อมูลส่วนตัว</a>
                        <form method="post" action="{% url 'logout' %}" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-pink-100">
                                ออกจากระบบ
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script>
        // Toggle Dropdown Menu
        const hamburgerButton = document.getElementById('hamburgerButton');
        const dropdownMenu = document.getElementById('dropdownMenu');

        hamburgerButton.addEventListener('click', (event) => {
            event.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });

        // Close the menu when clicking outside
        document.addEventListener('click', (event) => {
            const isClickInsideMenu = dropdownMenu.contains(event.target);
            const isClickHamburgerButton = event.target === hamburgerButton || hamburgerButton.contains(event.target);

            if (!isClickInsideMenu && !isClickHamburgerButton) {
                dropdownMenu.classList.remove('show');
            }
        });
    </script>
</body>

</html>
