{% extends 'Seniorproject/base.html' %}

{% block main %}
<section class="flex w-full h-screen items-center justify-center bg-gray-50">
    <div class="bg-white w-full max-w-lg p-8 rounded-lg shadow-xl">
        <!-- SIGN IN Header -->
        <div class="text-center mb-8">
            <p class="text-5xl font-semibold text-yellow-600 mb-6">เข้าสู่ระบบ</p> 
            <span class="block text-2xl font-light text-gray-800">Welcome Keep the world clean and share</span>
            <span class="block text-lg font-light text-gray-600 mt-2">ยังไม่ได้เป็นสมาชิก? 
                <a href="{% url 'signup' %}" class="underline text-yellow-600 hover:text-yellow-700">สมัครสมาชิก</a>
            </span>
        </div>

        <!-- Sign In Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Error Message -->
            {% if error_message %}
                <p class="text-red-500 text-sm text-center">{{ error_message }}</p>
            {% endif %}

            <div>
                <label class="block text-sm text-gray-800">ชื่อผู้ใช้</label>
                <input type="text" name="username" class="w-full h-14 p-3 mt-1 border border-gray-300 rounded-lg shadow-sm focus:ring focus:ring-yellow-300 focus:outline-none" required>
            </div>

            <div>
                <label class="block text-sm text-gray-800">รหัสผ่าน</label>
                <input type="password" name="password" class="w-full h-14 p-3 mt-1 border border-gray-300 rounded-lg shadow-sm focus:ring focus:ring-yellow-300 focus:outline-none" required>
            </div>

            <div class="flex justify-center">
                <button class="w-full h-14 bg-yellow-500 text-black font-medium rounded-lg shadow-md hover:bg-yellow-600 transition-all duration-300">เข้าสู่ระบบ</button>
            </div>
        </form>

        <!-- Forgot Password Link -->
        <div class="text-center mt-4">
            <a href="{% url 'password_reset' %}" class="text-yellow-600 text-sm underline hover:text-yellow-700">ลืมรหัสผ่าน?</a>
        </div>
    </div>
</section>
{% endblock main %}
