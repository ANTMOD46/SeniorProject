{% extends 'Seniorproject/base.html' %}

{% block main %}
<section class="flex w-full h-screen items-center justify-center bg-pink-40">
    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-lg">
        <!-- SIGN IN Header -->
        <div class="text-center mb-8">
            <p class="text-5xl font-semibold text-pink-500 mb-6">เข้าสู่ระบบ</p> 
            <span class="block text-2xl font-light text-pink-400">Welcome Keep the world clean and share</span>
            <span class="block text-lg font-light text-pink-400">ยังไม่ได้เป็นสมาชิก? 
                <a href="{% url 'signup' %}" class="underline text-pink-500 hover:text-pink-600">สมัครสมาชิก</a>
            </span>
        </div>

        <!-- Sign In Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Error Message -->
            {% if error_message %}
                <p class="text-red-500 text-sm text-center">{{ error_message }}</p>
            {% endif %}

            <div>
                <label class="block text-sm text-pink-600">ชื่อผู้ใช้</label>
                <input type="text" name="username" class="w-full h-14 p-2 mt-1 border border-pink-300 rounded-lg shadow-sm focus:ring focus:ring-pink-200" required>
            </div>

            <div>
                <label class="block text-sm text-pink-600">รหัสผ่าน</label>
                <input type="password" name="password" class="w-full h-14 p-2 mt-1 border border-pink-300 rounded-lg shadow-sm focus:ring focus:ring-pink-200" required>
            </div>

            <div class="flex justify-center">
                <button class="w-full h-14 bg-pink-500 text-white font-medium rounded-lg shadow-lg hover:bg-pink-600 transition-all duration-300">เข้าสู่ระบบ</button>
            </div>
        </form>

        <!-- Forgot Password Link -->
        <div class="text-center mt-4">
            <a href="{% url 'password_reset' %}" class="text-blue-600 text-sm underline">ลืมรหัสผ่าน?</a>
        </div>
    </div>
</section>
{% endblock main %}
