<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock title %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
        .auth-container {
            max-width: 400px;
            margin: auto;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background: white;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="auth-container bg-white">
        <h1 class="text-2xl font-bold text-center text-pink-500">{% block title %}</h1>
        <div class="mt-4">
            {% block content %}
            <!-- Authentication content goes here -->
            {% endblock content %}
        </div>
    </div>

</body>
</html>
