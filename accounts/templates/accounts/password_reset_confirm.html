{% extends "accounts/base_auth.html" %}

{% block content %}
<div class="p-6 bg-white rounded-lg shadow-lg">
    <h2 class="text-xl font-bold text-center text-blue-500 mb-4">Set a New Password</h2>
    <p class="text-sm text-gray-500 text-center mb-6">
        Please enter your new password below and confirm it to reset your account password.
    </p>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_new_password1" class="block text-sm font-medium text-gray-700">New Password</label>
            <input 
                type="password" 
                name="new_password1" 
                id="id_new_password1"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter new password"
                required>
        </div>
        <div>
            <label for="id_new_password2" class="block text-sm font-medium text-gray-700">Confirm New Password</label>
            <input 
                type="password" 
                name="new_password2" 
                id="id_new_password2"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Confirm new password"
                required>
        </div>
        <button 
            type="submit" 
            class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
            Set New Password
        </button>
    </form>
</div>
{% endblock %}
