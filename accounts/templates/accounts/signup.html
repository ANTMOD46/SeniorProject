{% extends 'Seniorproject/base.html' %}
{% load static %}  
{% block main %}
<section class="flex w-full min-h-screen items-center justify-center mt-28 bg-white">
    <div class="bg-gray-100 w-full max-w-4xl p-8 shadow-lg rounded-lg">
        <div class="text-center mb-8">
            <p class="text-5xl font-semibold text-gray-900 mb-6">สมัครสมาชิก</p>
            <span class="block text-2xl font-light text-gray-700">สร้างบัญชีใหม่และเข้าร่วมกับเรา!</span>
            <span class="block text-lg font-light text-gray-500 mt-2">มีบัญชีอยู่แล้ว?
                <a href="{% url 'login' %}" class="underline text-blue-600 hover:text-blue-700">เข้าสู่ระบบ</a>
            </span>
        </div>   

        <form method="post" class="space-y-8" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Profile Image Upload -->
            <div class="flex flex-col items-center justify-center mb-8 relative">
                <label for="profile_image" class="cursor-pointer">
                    <div class="relative">
                        <span class="absolute top-[-2.5rem] text-gray-700 font-semibold text-lg">เพิ่มรูปโปรไฟล์</span>
                        <div class="w-32 h-32 rounded-full border-4 border-gray-300 flex items-center justify-center overflow-hidden mt-2">
                            <img src="{% static 'css/dist/Seniorproject/img/profile1.png' %}" id="profile_preview" class="w-28 h-28 rounded-full object-cover object-center" alt="Profile Image">
                        </div>
                    </div>
                </label>
                <input type="file" name="profile_picture" id="profile_image" class="input-file" accept="image/*" onchange="previewImage(event)">
            </div>

            <div class="flex space-x-4">
                <div class="w-1/2">
                    <label class="block text-sm text-gray-700">ชื่อ</label>
                    <input type="text" name="first_name" class="input-field" required>
                </div>
                <div class="w-1/2">
                    <label class="block text-sm text-gray-700">นามสกุล</label>
                    <input type="text" name="last_name" class="input-field" required>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-700">ที่อยู่</label>
                <input type="text" name="address" id="address" class="input-field" required>
                <p id="address-error" class="text-red-500 text-sm hidden">กรุณากรอกที่อยู่</p>
            </div>

            <div>
                <label class="block text-sm text-gray-700">เบอร์โทรศัพท์</label>
                <input type="text" name="phone_number" id="phone_number" class="input-field" required>
                <p id="phone-error" class="text-red-500 text-sm hidden">เบอร์โทรศัพท์ต้องมี 10 หลัก</p>
            </div>

            <div>
                <label class="block text-sm text-gray-700">อีเมล</label>
                <input type="email" name="email" id="email" class="input-field" required>
                <p id="email-error" class="text-red-500 text-sm hidden"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-700">ชื่อผู้ใช้</label>
                <input type="text" name="username" id="username" class="input-field" required>
                <p id="username-error" class="text-red-500 text-sm hidden"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-700">รหัสผ่าน</label>
                <input type="password" name="password1" id="password1" class="input-field" required>
            </div>

            <div>
                <label class="block text-sm text-gray-700">ยืนยันรหัสผ่าน</label>
                <input type="password" name="password2" id="password2" class="input-field" required>
                <p id="password-match-error" class="text-red-500 text-sm hidden">รหัสผ่านไม่ตรงกัน</p>
            </div>

            <div class="flex justify-center">
                <button type="submit" class="w-80 h-14 bg-gray-900 text-white font-medium rounded-lg shadow-lg hover:bg-gray-800 transition-all duration-300">สมัครสมาชิก</button>
            </div>
        </form>
    </div>
</section>

<style>
    .input-file {
        visibility: hidden;
        position: absolute;
    }
    .input-field {
        width: 100%;
        height: 3.5rem;
        padding: 0.5rem;
        margin-top: 0.25rem;
        background-color: #f0f9ff;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
    }
</style>

<script>
    document.getElementById('phone_number').addEventListener('input', function () {
        const phone = this.value;
        const errorMsg = document.getElementById('phone-error');
        
        if (!/^\d{10}$/.test(phone)) {
            errorMsg.classList.remove('hidden');
        } else {
            errorMsg.classList.add('hidden');
        }
    });

    document.getElementById('password2').addEventListener('input', function () {
        const password1 = document.getElementById('password1').value;
        const password2 = this.value;
        const errorMsg = document.getElementById('password-match-error');
        
        if (password1 !== password2) {
            errorMsg.classList.remove('hidden');
        } else {
            errorMsg.classList.add('hidden');
        }
    });

    document.getElementById('username').addEventListener('blur', function () {
        const username = this.value;
        fetch(`/check-username/?username=${username}`)
            .then(response => response.json())
            .then(data => {
                const errorMsg = document.getElementById('username-error');
                if (data.exists) {
                    errorMsg.textContent = "ชื่อผู้ใช้ถูกใช้ไปแล้ว";
                    errorMsg.classList.remove('hidden');
                } else {
                    errorMsg.classList.add('hidden');
                }
            });
    });

    document.getElementById('email').addEventListener('blur', function () {
        const email = this.value;
        fetch(`/check-email/?email=${email}`)
            .then(response => response.json())
            .then(data => {
                const errorMsg = document.getElementById('email-error');
                if (data.exists) {
                    errorMsg.textContent = "อีเมลถูกใช้ไปแล้ว";
                    errorMsg.classList.remove('hidden');
                } else {
                    errorMsg.classList.add('hidden');
                }
            });
    });
</script>

{% endblock main %}
