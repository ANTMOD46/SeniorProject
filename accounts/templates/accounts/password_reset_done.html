{% extends "accounts/base_auth.html" %}

{% block content %}
<div class="p-6 bg-white rounded-lg shadow-lg">
    <h2 class="text-xl font-bold text-center text-blue-500">Password Reset Link Sent</h2>
    <p class="text-sm text-gray-500 text-center mb-4">
        We’ve sent a password reset link to your email. Please check your inbox and follow the instructions to reset your password.
    </p>
    <div class="text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-500 mx-auto my-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10l9-7 9 7-9 7-9-7zm0 0v11a2 2 0 002 2h14a2 2 0 002-2V10m-4 4l-8 4m0-8l8 4" />
        </svg>
    </div>
    <a href="/accounts/login/" class="block w-full bg-blue-500 text-white text-center py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
        Go to Login
    </a>
</div>
{% endblock %}
