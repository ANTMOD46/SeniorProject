{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>เพิ่มวิธีจัดการขยะ</title>
    <style>
        .hidden { display: none; }
        .waste-item { border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    {% include 'accounts/header_logged_in.html' %}
    <div class="pt-20 h-full flex flex-col items-center justify-start">
        <h1 class="text-4xl font-bold text-orange-600 text-center mb-6">เพิ่มวิธีจัดการขยะ</h1>

        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-xl">
            <form method="post" enctype="multipart/form-data" action="{% url 'barcode_scanner:add_waste_item' %}">
                {% csrf_token %}
                
                <!-- Barcode -->
                <div class="mb-6">
                    <label for="barcode" class="block text-lg text-blue-600 font-medium">รหัสบาร์โค้ด:</label>
                    <input type="text" id="barcode" name="barcode" value="{{ form.barcode.value }}" class="border border-gray-300 rounded-md w-full p-2">
                </div>
                
                <!-- Brand Name -->
                <div class="mb-6">
                    <label for="brand_name" class="block text-lg text-blue-600 font-medium">ชื่อยี่ห้อ:</label>
                    <input type="text" id="brand_name" name="brand_name" value="{{ form.brand_name.value }}" class="border border-gray-300 rounded-md w-full p-2">
                </div>
                
                <!-- Product Name -->
                <div class="mb-6">
                    <label for="product_name" class="block text-lg text-blue-600 font-medium">ชื่อผลิตภัณฑ์:</label>
                    <input type="text" id="product_name" name="product_name" value="{{ form.product_name.value }}" class="border border-gray-300 rounded-md w-full p-2">
                </div>
                
                <!-- Waste Type -->
                <div class="mb-6">
                    <label for="waste_type" class="block text-lg text-blue-600 font-medium">ประเภทขยะ:</label>
                    <select id="waste_type" name="waste_type" class="border border-gray-300 rounded-md w-full p-2">
                        <option value="">-- เลือกประเภทขยะ --</option>
                        <option value="plastic">พลาสติก</option>
                        <option value="paper">กระดาษ</option>
                        <option value="metal">โลหะ</option>
                        <option value="glass">แก้ว</option>
                        <option value="others">อื่นๆ</option>
                    </select>
                </div>
                
                <!-- Subtype -->
                <div class="mb-6">
                    <label for="subtype" class="block text-lg text-blue-600 font-medium">หมวดหมู่ย่อย:</label>
                    <select id="subtype" name="subtype" class="border border-gray-300 rounded-md w-full p-2">
                        <option value="">-- เลือกหมวดหมู่ย่อย --</option>
                    </select>
                </div>
                
                <!-- Category -->
                <div class="mb-6">
                    <label for="category" class="block text-lg text-blue-600 font-medium">หมวดหมู่:</label>
                    {{ form.category }}
                </div>
                
                <!-- Separation Method -->
                <div class="mb-6">
                    <label for="separation_method" class="block text-lg text-blue-600 font-medium">วิธีการแยกขยะ:</label>
                    <textarea id="separation_method" name="separation_method" class="border border-gray-300 rounded-md w-full p-2">{{ form.separation_method.value }}</textarea>
                </div>
                
                <!-- Product Image -->
                <div class="mb-6">
                    <label for="product_image" class="block text-lg text-blue-600 font-medium">ภาพผลิตภัณฑ์:</label>
                    <input type="file" id="product_image" name="product_image" class="border border-gray-300 rounded-md w-full p-2">
                </div>

                <!-- Waste Images -->
                <div id="waste-images-container">
                    <label class="block text-lg text-blue-600 font-medium">รูปภาพขยะ:</label>
                    <div class="waste-item" id="waste-item-1">
                        <input type="file" id="waste_images" name="waste_images" multiple class="border border-gray-300 rounded-md w-full p-2">
                    </div>
                </div>

                <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-md">บันทึก</button>
            </form>
        </div>
    </div>

    <script>
        // Mapping waste type to subtypes
        const wasteTypeToSubtypes = {
            plastic: ['พลาสติกแข็ง', 'พลาสติกใส', 'พลาสติกฟิล์ม'],
            paper: ['กระดาษสี', 'กระดาษขาวดำ', 'กระดาษลัง'],
            metal: ['อลูมิเนียม', 'เหล็ก'],
            glass: ['แก้วใส', 'แก้วสี'],
            others: ['อื่นๆ']
        };

        document.addEventListener("DOMContentLoaded", function() {
            const wasteTypeSelect = document.getElementById("waste_type");
            const subtypeSelect = document.getElementById("subtype");

            // Event listener for when the waste type is changed
            wasteTypeSelect.addEventListener("change", function() {
                const selectedWasteType = this.value;

                // Clear previous options
                subtypeSelect.innerHTML = '<option value="">-- เลือกหมวดหมู่ย่อย --</option>';

                // Populate new options based on the selected waste type
                if (selectedWasteType && wasteTypeToSubtypes[selectedWasteType]) {
                    wasteTypeToSubtypes[selectedWasteType].forEach(subtype => {
                        const option = document.createElement("option");
                        option.value = subtype;
                        option.textContent = subtype;
                        subtypeSelect.appendChild(option);
                    });
                }
            });
        });
    </script>
</body>
</html>
