{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>เพิ่มวิธีจัดการขยะ</title>
    <style>
        .hidden { display: none; }
        .waste-item { border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
        .waste-item-header { background-color: #f9fafb; padding: 8px; border-radius: 4px; font-weight: bold; }
        .waste-item-content { margin-top: 8px; }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    {% include 'accounts/header_logged_in.html' %}
    <div class="pt-20 h-full flex flex-col items-center justify-start">
        <h1 class="text-4xl font-bold text-orange-600 text-center mb-6">เพิ่มวิธีจัดการขยะ</h1>

        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-xl">
            <form method="post" enctype="multipart/form-data" action="{% url 'barcode_scanner:add_waste_item' %}">
                {% csrf_token %}

                <!-- Barcode -->
                <div class="mb-6">
                    <label for="barcode" class="block text-lg text-blue-600 font-medium">รหัสบาร์โค้ด:</label>
                    <input type="text" id="barcode" name="barcode" value="{{ barcode|default_if_none:'' }}" class="border border-gray-300 rounded-md w-full p-2">
                </div>

                <!-- Brand Name -->
                <div class="mb-6">
                    <label for="brand_name" class="block text-lg text-blue-600 font-medium">ชื่อยี่ห้อ:</label>
                    <input type="text" id="brand_name" name="brand_name" class="border border-gray-300 rounded-md w-full p-2">
                </div>

                <!-- Product Name -->
                <div class="mb-6">
                    <label for="product_name" class="block text-lg text-blue-600 font-medium">ชื่อผลิตภัณฑ์:</label>
                    <input type="text" id="product_name" name="product_name" class="border border-gray-300 rounded-md w-full p-2">
                </div>

                <!-- Product Image -->
                <div class="mb-6">
                    <label for="product_image" class="block text-lg text-blue-600 font-medium">ภาพผลิตภัณฑ์:</label>
                    <input type="file" id="product_image" name="product_image" class="border border-gray-300 rounded-md w-full p-2">
                </div>

                <!-- Waste Items Container -->
                <div id="waste-items-container">
                    <div class="waste-item" id="waste-item-1">
                        <div class="waste-item-header">ขยะชิ้นที่ 1</div>
                        <div class="waste-item-content">
                            <!-- Waste Image -->
                            <label for="images-1" class="block text-lg text-blue-600 font-medium mt-4">รูปภาพขยะ:</label>
                            <input type="file" id="images-1" name="images-1" class="border border-gray-300 rounded-md w-full p-2">

                            <!-- Waste Type -->
                            <div class="mb-6">
                                <label for="waste_type-1" class="block text-lg text-blue-600 font-medium">ประเภทขยะ:</label>
                                <select id="waste_type-1" name="waste_type-1" class="border border-gray-300 rounded-md w-full p-2">
                                    <option value="">-- เลือกประเภทขยะ --</option>
                                    <option value="plastic">พลาสติก</option>
                                    <option value="paper">กระดาษ</option>
                                    <option value="metal">โลหะ</option>
                                    <option value="glass">แก้ว</option>
                                    <option value="others">อื่นๆ</option>
                                </select>
                            </div>

                            <!-- Subtype -->
                            <div class="mb-6">
                                <label for="subtype-1" class="block text-lg text-blue-600 font-medium">หมวดหมู่ย่อย:</label>
                                <select id="subtype-1" name="subtype-1" class="border border-gray-300 rounded-md w-full p-2">
                                    <option value="">-- เลือกหมวดหมู่ย่อย --</option>
                                </select>
                            </div>

                            <!-- Category -->
                            <div class="mb-6">
                                <label for="category-1" class="block text-lg text-blue-600 font-medium">หมวดหมู่:</label>
                                <select id="category-1" name="category-1" class="border border-gray-300 rounded-md w-full p-2">
                                    <option value="">-- เลือกหมวดหมู่ --</option>
                                    <option value="recyclable">สามารถรีไซเคิลได้</option>
                                    <option value="non_recyclable">ไม่สามารถรีไซเคิลได้</option>
                                    <option value="hazardous">ของเสียอันตราย</option>
                                    <option value="compostable">สามารถย่อยสลายได้</option>
                                </select>
                            </div>

                            <!-- Separation Method -->
                            <div class="mb-6">
                                <label for="separation_method-1" class="block text-lg text-blue-600 font-medium">วิธีการแยกขยะ:</label>
                                <textarea id="separation_method-1" name="separation_method-1" rows="4" class="border border-gray-300 rounded-md w-full p-2"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Waste Item Button -->
                <button type="button" id="add-waste-item-btn" class="bg-green-500 text-white px-4 py-2 rounded-lg mt-4">
                    + เพิ่มขยะชิ้นที่
                </button>

                <!-- Submit Button -->
                <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-400 mt-4">
                    บันทึก
                </button>
            </form>
        </div>
    </div>

    <script>
        const wasteTypeToSubtypes = {
            plastic: ['พลาสติกแข็ง', 'พลาสติกใส', 'พลาสติกฟิล์ม','ถุง/ฟิล์ม ยืด PE','ฟิล์มพลาสติกหลายชั้นเคลือบโลหะ','ขวดPETใส','พลาสติกเหนียว PP+PE','PETรวมใส','พลาสติกกรอบ PS+ABS+PC','โฟมPS','ถุง/ฟิล์ม PP รวม','ฟิล์มหดPVC','ฟิล์มพลาสติกหลายชั้น','หลอดบีบพลาสติกหลายชั้น','ถุง/ฟิล์มOPP','หลอดพลาสติก','ฟิล์มพลาสติกPOF','แก้วพลาสติก ประเภท PET'],
            paper: ['กระดาษสี', 'กระดาษขาวดำ', 'กระดาษลัง','กระดาษกล่อง','กระดาษเศษ','หนังสือพิมพ์เล่ม','กล่องเครื่องดื่ม','กระดาษเคลือบพลาสติก','แกนกระดาษ','หนังสือเก่า'],
            metal: ['กระป๋องอลูมิเนียม', 'อลูมิเนียมรวมเกรด','อลูมิเนียมแข็งรวม','อลูมิเนียมบางรวม','ทองแดงรวมเกรด','สังกะสีรวมเกรด','ทองเหลืองรวมเกรด','สังกะสีรวมเกรด','อลูมิเนียมฟอยล์'],
            glass: ['ขวดแก้วขาว', 'ขวดแก้วแดง','ขวดแก้วเขียว','ขวดแก้วรวมสี','กระจกใส','กระจกสีชา','ขวดช้างใหญ่ลัง','ขวดลีโอใหญ่ลัง','ขวดลีโอเล็กลัง','ขวดเบียร์สิงห์ใหญ่ลัง','กระจกเงา'],
            e_waste: ['เครื่องใช้ไฟฟ้ารวม', 'ถ่านไฟฉายรวม','สายไฟรวม','แบตเตอรี่ตะกั่วกรดรวมเกรด','จอแก้วคอมพิวเอตร์/โทรทัศน์','จอ LED/LCDคอมพิวเตอร์/โทรทัศน์','มอเตอร์/เครื่องกำเนิดไฟฟ้า','หลอดไฟฟลูออเรสเซนต์','โทรศัพท์มือถือสมาร์ทโฟน','โทรศัพท์มือถือปุ่มกด','เคสคอมพิวเตอร์ครบชุด','โน๊ตบุ๊ค','บอร์ดอิเล็กทรอนิกส์รวม','เครื่องปริ้นเตอร์','เครื่องสำรองไฟ','เครื่องถ่ายเอกสาร','โทรศัพท์/แฟกซ์','พัดลม','เครื่องปรับอากาศครบชุด','ตู้เย็น','หม้อหุงข้าว','หลอดไฟแบบไส้','เครื่องซักผ้า'],
            steel: ['กระป๋องเหล็กสังกะสี','เศษเหล็กรวม','เศษเหล็กหนา','เสษเหล็กหนายาว','เหล็กหล่อ','ขี้กลึงเหล็ก','สังกะสีแผ่นเหล็ก','สแตนเลสรวมเกรด','สแตนเลส 304','สแตนเลส 2XX','สแตนเลสดูดติด 4XX','สแตนเลสติดตะกั่ว'],
            others: ['น้ำมันพืช/ สัตว์เก่า','อาหารที่ยังไม่ได้รับประทาน','วัตถุดิบที่ยังไม่เน่าเสีย','เศษอาหารรับประทานเหลือ','เศษอาหารส่วนที่รับประทานไม่ได้','ท่อนไม้ กิ่งไม้ ใหญ่','น้ำมันเครื่องเก่า','เสื้อผ้ามือสอง รวมประเภท','ยางรถยนต์เก่า','ขี้เลื่อยไม้','เฟอร์นิเจอร์เก่า','รองเท้าเก่า','ยางชนิดต่างๆ','ของเล่นเก่าทุกชนิด','ตุ๊กตาเก่า','หน้ากากอนามัยใช้แล้ว ชนิดต่างๆ','กากกาแฟ','ถุงผ้า','ซองกันชื้น','เสื้อยืด','เสื้อชั้นใน']
        };


        document.addEventListener("DOMContentLoaded", function() {
            const addSubtypeOptions = (wasteType, subtypeSelect) => {
                subtypeSelect.innerHTML = '<option value="">-- เลือกหมวดหมู่ย่อย --</option>';
                if (wasteTypeToSubtypes[wasteType]) {
                    wasteTypeToSubtypes[wasteType].forEach(subtype => {
                        const option = document.createElement("option");
                        option.value = subtype;
                        option.textContent = subtype;
                        subtypeSelect.appendChild(option);
                    });
                }
            };

            document.querySelectorAll("[id^='waste_type']").forEach(wasteTypeSelect => {
                const subtypeSelectId = wasteTypeSelect.id.replace("waste_type", "subtype");
                const subtypeSelect = document.getElementById(subtypeSelectId);

                wasteTypeSelect.addEventListener("change", function() {
                    addSubtypeOptions(this.value, subtypeSelect);
                });
            });

            let wasteItemCount = 1;
            const wasteItemsContainer = document.getElementById("waste-items-container");
            const addWasteItemBtn = document.getElementById("add-waste-item-btn");

            addWasteItemBtn.addEventListener("click", function() {
                wasteItemCount++;

                const newWasteItem = document.createElement("div");
                newWasteItem.classList.add("waste-item");
                newWasteItem.id = `waste-item-${wasteItemCount}`;

                newWasteItem.innerHTML = `
                    <div class="waste-item-header">ขยะชิ้นที่ ${wasteItemCount}</div>
                    <div class="waste-item-content">
                        <label for="images-${wasteItemCount}" class="block text-lg text-blue-600 font-medium mt-4">รูปภาพขยะ:</label>
                        <input type="file" id="images-${wasteItemCount}" name="images-${wasteItemCount}" class="border border-gray-300 rounded-md w-full p-2">

                        <label for="waste_type-${wasteItemCount}" class="block text-lg text-blue-600 font-medium mt-4">ประเภทขยะ:</label>
                        <select id="waste_type-${wasteItemCount}" name="waste_type-${wasteItemCount}" class="border border-gray-300 rounded-md w-full p-2">
                            <option value="">-- เลือกประเภทขยะ --</option>
                            <option value="plastic">พลาสติก</option>
                            <option value="paper">กระดาษ</option>
                            <option value="metal">โลหะ</option>
                            <option value="glass">แก้ว</option>
                            <option value="others">อื่นๆ</option>
                        </select>

                        <label for="subtype-${wasteItemCount}" class="block text-lg text-blue-600 font-medium mt-4">หมวดหมู่ย่อย:</label>
                        <select id="subtype-${wasteItemCount}" name="subtype-${wasteItemCount}" class="border border-gray-300 rounded-md w-full p-2">
                            <option value="">-- เลือกหมวดหมู่ย่อย --</option>
                        </select>

                        <label for="category-${wasteItemCount}" class="block text-lg text-blue-600 font-medium mt-4">หมวดหมู่:</label>
                        <select id="category-${wasteItemCount}" name="category-${wasteItemCount}" class="border border-gray-300 rounded-md w-full p-2">
                            <option value="">-- เลือกหมวดหมู่ --</option>
                            <option value="recyclable">สามารถรีไซเคิลได้</option>
                            <option value="non_recyclable">ไม่สามารถรีไซเคิลได้</option>
                            <option value="hazardous">ของเสียอันตราย</option>
                            <option value="compostable">สามารถย่อยสลายได้</option>
                        </select>

                        <label for="separation_method-${wasteItemCount}" class="block text-lg text-blue-600 font-medium mt-4">วิธีการแยกขยะ:</label>
                        <textarea id="separation_method-${wasteItemCount}" name="separation_method-${wasteItemCount}" rows="4" class="border border-gray-300 rounded-md w-full p-2"></textarea>
                    </div>
                `;

                wasteItemsContainer.appendChild(newWasteItem);

                const wasteTypeSelect = document.getElementById(`waste_type-${wasteItemCount}`);
                const subtypeSelect = document.getElementById(`subtype-${wasteItemCount}`);

                wasteTypeSelect.addEventListener("change", function() {
                    addSubtypeOptions(this.value, subtypeSelect);
                });
            });
        });
    </script>
</body>
</html>
