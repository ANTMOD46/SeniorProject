{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>แสกนบาร์โค้ด (Guest)</title>
</head>
<body class="bg-gray-50 font-sans h-screen">
    <div class="pt-20 h-full flex flex-col items-center justify-start">
        <h1 class="text-4xl font-bold text-blue-600 text-center mb-6">สแกนบาร์โค้ด</h1>
        <div id="interactive" class="viewport mb-6" style="max-width: 640px; width: 100%; height: auto;"></div>
        
        <script>
            function startQuagga() {
                Quagga.init({
                    inputStream: {
                        type: "LiveStream",
                        constraints: {
                            width: 640,
                            height: 480,
                            facingMode: "environment"
                        },
                    },
                    decoder: {
                        readers: ["code_128_reader", "ean_reader", "upc_reader"]
                    }
                }, function(err) {
                    if (err) {
                        console.error(err);
                        alert("เกิดข้อผิดพลาดในการเริ่มต้นกล้อง");
                        return;
                    }
                    Quagga.start();
                });

                Quagga.onDetected(function(data) {
                    const barcode = data.codeResult.code;
                    window.location.href = '/scanner/scan-result-guest/?barcode=' + barcode;
                    Quagga.stop();
                });
            }

            document.addEventListener("DOMContentLoaded", function() {
                startQuagga();
            });
        </script>
    </div>
</body>
</html>
