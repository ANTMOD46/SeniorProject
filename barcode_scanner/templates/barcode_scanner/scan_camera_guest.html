{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สแกนบาร์โค้ด (Guest)</title>
    <style>
        * {
            font-family: 'Kanit', sans-serif;
        }
        .viewport {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 360px;
            border: 2px dashed #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f0f8ff;
        }
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 50%;
            border: 4px solid #1e40af;
            box-shadow: 0 0 10px rgba(30, 64, 175, 0.5);
            z-index: 10;
            pointer-events: none;
        }
        .scan-guide {
            position: absolute;
            bottom: -40px;
            background-color: #f0f8ff;
            padding: 10px 20px;
            border-radius: 8px;
            color: #1e40af;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    <div class="pt-20 h-full flex flex-col items-center justify-start">
        <h1 class="text-4xl font-bold text-gray-700 text-center mb-6">สแกนบาร์โค้ด</h1>
        <div class="viewport relative">
            <video id="video" class="viewport w-full h-full" autoplay></video>
            <div class="scan-frame"></div>
            <p class="scan-guide">โปรดวางบาร์โค้ดในกรอบนี้</p>
        </div>
        <div id="error-message" class="hidden bg-red-100 text-red-700 px-4 py-2 rounded-lg mt-6">
            ไม่สามารถตรวจจับบาร์โค้ดได้ กรุณาลองใหม่อีกครั้ง หรือกรอกรหัสบาร์โค้ดด้านล่าง
        </div>
        <form action="{% url 'scanner:handle_barcode_guest' %}" method="GET" class="flex flex-col items-center gap-4 mt-6">
            <input 
                type="text" 
                name="barcode" 
                placeholder="กรอกรหัสบาร์โค้ดที่นี่" 
                class="border border-gray-300 rounded-lg px-4 py-2 text-lg w-64 focus:ring focus:ring-gray-400 focus:outline-none"
                required>
            <button 
                type="submit" 
                class="bg-yellow-600 text-white px-8 py-2 rounded-lg shadow-lg hover:bg-blue-700 focus:outline-none focus:ring focus:ring-blue-300">
                ค้นหาบาร์โค้ด
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const videoElement = document.getElementById("video");
            const errorMessage = document.getElementById("error-message");
        
            const codeReader = new ZXing.BrowserMultiFormatReader();
        
            codeReader.getVideoInputDevices().then(videoInputDevices => {
                if (videoInputDevices.length === 0) {
                    console.error("ไม่พบกล้องในอุปกรณ์");
                    alert("ไม่พบกล้องบนอุปกรณ์ของคุณ");
                    return;
                }
        
                const selectedDeviceId = videoInputDevices[0].deviceId; // ใช้กล้องตัวแรก
        
                codeReader.decodeFromVideoDevice(selectedDeviceId, videoElement, (result, err) => {
                    if (result) {
                        console.log("✅ บาร์โค้ดที่พบ:", result.text);
                        window.location.href = '/scanner/handle-barcode/?barcode=' + result.text;
                    } else if (err) {
                        console.error("❌ ข้อผิดพลาด:", err);
                        errorMessage.classList.remove("hidden");
                    }
                });
            }).catch(err => {
                console.error("❌ เกิดข้อผิดพลาดในการเข้าถึงกล้อง:", err);
                alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบสิทธิ์");
            });
        });
        
    </script>
</body>
</html>
