<!DOCTYPE html>
<html>
<head>
    <title>Scan Barcode</title>
</head>
<body>
    <h1>Scan Barcode</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="barcode_image" accept="image/*" required>
        <input type="submit" value="Scan Barcode">
    </form>
</body>
</html>
