<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>ยังไม่มีข้อมูลบาร์โค้ดนี้</title>
</head>
<body class="bg-gradient-to-br from-white via-cyan-50 to-emerald-50 font-sans">
  <section class="flex w-full h-screen items-center justify-center">
    <div class="bg-white w-full max-w-lg p-8 rounded-xl shadow-xl border border-cyan-100">
      <!-- Header -->
      <div class="text-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-20 w-20 text-cyan-500 mx-auto mb-4"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4v1m0 10v1m-7-6h1m10 0h1m-9 3.5h4m-4-3.5h4m2-2a7 7 0 10-14 0 7 7 0 0014 0z" />
        </svg>
        <h1 class="text-2xl font-bold text-emerald-800">ยังไม่มีข้อมูลบาร์โค้ดนี้</h1>
        <p class="text-emerald-700 mt-2">
          เพิ่มข้อมูลการแยกขยะของคุณได้ง่าย ๆ เพียงสมัครสมาชิก
        </p>
      </div>

      <!-- Call to Action Button -->
      <div class="text-center">
        <button 
          onclick="window.location.href='/accounts/signup/'" 
          class="w-full py-3 px-4 bg-cyan-500 text-white font-medium rounded-md shadow-md hover:bg-cyan-600 transition duration-200">
          สมัครสมาชิก
        </button>
      </div>
    </div>
  </section>
</body>
</html>
