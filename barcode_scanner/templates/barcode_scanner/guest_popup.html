<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ยังไม่มีข้อมูลบาร์โค้ดนี้</title>
    <style>
        .rounded-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            max-width: 500px;
        }
        .cta-button {
            background-color: #1d4ed8;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .cta-button:hover {
            background-color: #2563eb;
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="bg-white font-sans h-screen flex items-center justify-center">
    <div class="rounded-card bg-gradient-to-b from-white to-blue-50 text-center">
        <!-- Icon -->
        <div class="mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-blue-600 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 10v1m-7-6h1m10 0h1m-9 3.5h4m-4-3.5h4m2-2a7 7 0 10-14 0 7 7 0 0014 0z" />
            </svg>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-bold text-blue-600 mb-4">ยังไม่มีข้อมูลบาร์โค้ดนี้</h1>

        <!-- Description -->
        <p class="text-lg text-gray-700 mb-6">
            เพิ่มข้อมูลการแยกขยะของคุณได้ง่าย ๆ เพียงสมัครสมาชิก
        </p>

        <!-- Button -->
        <button 
            onclick="window.location.href='/accounts/signup/'" 
            class="cta-button py-3 px-8 rounded-full text-lg shadow-md">
            สมัครสมาชิก
        </button>
    </div>
</body>
</html>
