{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สแกนบาร์โค้ด</title>
    <style>
        .scanner-container {
            position: relative;
            max-width: 640px;
            width: 100%;
            height: 360px;
            margin: 0 auto;
            background-color: #f9fafb;
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            overflow: hidden;
        }
         @keyframes scan-line {
            0% { transform: translateY(-50%) scaleY(1); opacity: 0.1; }
            50% { transform: translateY(-50%) scaleY(1.2); opacity: 0.7; }
            100% { transform: translateY(-50%) scaleY(1); opacity: 0.1; }
        }

        .animate-pulse {
            animation: scan-line 1.5s infinite ease-in-out;
        }

        .error-message {
            display: none;
            text-align: center;
            color: red;
            background: #ffe5e5;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    {% include 'accounts/header_logged_in.html' %}

    <div class="pt-20 h-full flex flex-col items-center justify-start bg-gray-50">
        <h1 class="text-4xl font-bold text-gray-900 text-center mb-6">สแกนบาร์โค้ด</h1>

    <div class="relative mt-4 w-full max-w-md h-[360px] rounded-xl overflow-hidden shadow-lg border-4 border-emerald-400 bg-gray-100">
    <!-- กล้อง -->
    <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>

    <!-- เส้นกรอบสี่มุม -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-emerald-500 rounded-tl-xl"></div>
        <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-emerald-500 rounded-tr-xl"></div>
        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-emerald-500 rounded-bl-xl"></div>
        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-emerald-500 rounded-br-xl"></div>
    </div>

  <!-- แถบเลเซอร์วิ่งผ่าน -->
  <div class="absolute top-1/2 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-400 to-transparent animate-pulse opacity-70"></div>
</div>


        <!-- ข้อความแสดงข้อผิดพลาด -->
        <div id="error-message" class="error-message">
            ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาต
        </div>

        <!-- ฟอร์มกรอกรหัสบาร์โค้ด -->
        <form action="{% url 'barcode_scanner:handle_barcode_member' %}" method="GET" class="flex flex-col items-center gap-4 mt-4">
            <input 
                type="text" 
                name="barcode" 
                placeholder="กรอกรหัสบาร์โค้ดที่นี่" 
                class="border border-gray-300 rounded-lg px-4 py-2 text-lg w-64 focus:ring focus:ring-gray-400 focus:outline-none"
                required>
            <button 
                type="submit" 
                class="bg-yellow-500 text-white px-8 py-2 rounded-lg shadow-lg hover:bg-yellow-600 focus:outline-none focus:ring focus:ring-yellow-300">
                ค้นหาบาร์โค้ด
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            let codeReader = new ZXing.BrowserMultiFormatReader();
            let videoElement = document.getElementById("video");
            let errorMessage = document.getElementById("error-message");
        
            try {
                // ดึงรายการกล้องทั้งหมด
                let videoInputDevices = await codeReader.getVideoInputDevices();
                if (videoInputDevices.length === 0) {
                    throw new Error("ไม่พบกล้องในอุปกรณ์");
                }
        
                // ตรวจสอบว่ามีหลายกล้องหรือไม่
                let backCamera = videoInputDevices.find(device => device.label.toLowerCase().includes("back"))?.deviceId;
                let frontCamera = videoInputDevices.find(device => device.label.toLowerCase().includes("front"))?.deviceId;
        
                let selectedDeviceId = backCamera || videoInputDevices[0].deviceId; // ใช้กล้องหลัง ถ้าไม่มีให้ใช้ตัวแรก
        
                console.log("📸 ใช้กล้อง:", selectedDeviceId);
        
                // เริ่มต้นสแกน
                codeReader.decodeFromVideoDevice(selectedDeviceId, videoElement, (result, err) => {
                    if (result) {
                        console.log("✅ บาร์โค้ดที่พบ:", result.text);
                        window.location.href = `/scanner/scan-member/?barcode=${result.text}`;
                    } else if (err) {
                        console.warn("⛔️ ไม่พบบาร์โค้ด:", err);
                        errorMessage.textContent = "ไม่สามารถตรวจจับบาร์โค้ดได้ กรุณาลองใหม่อีกครั้ง หรือกรอกรหัสบาร์โค้ดด้านล่าง";
                        errorMessage.classList.add("active");
                    }
                });
        
                // เพิ่ม Event ให้กดที่กล้องเพื่อเปลี่ยนกล้อง (ถ้ามีหลายตัว)
                videoElement.addEventListener("click", function () {
                    if (backCamera && frontCamera) {
                        selectedDeviceId = selectedDeviceId === backCamera ? frontCamera : backCamera;
                        console.log("🔄 เปลี่ยนกล้องเป็น:", selectedDeviceId);
                        codeReader.reset();
                        codeReader.decodeFromVideoDevice(selectedDeviceId, videoElement, (result, err) => {
                            if (result) {
                                console.log("✅ บาร์โค้ดที่พบ:", result.text);
                                window.location.href = `/scanner/scan-member/?barcode=${result.text}`;
                            } else if (err) {
                                console.warn("⛔️ ไม่พบบาร์โค้ด:", err);
                                errorMessage.textContent = "ไม่สามารถตรวจจับบาร์โค้ดได้ กรุณาลองใหม่อีกครั้ง หรือกรอกรหัสบาร์โค้ดด้านล่าง";
                                errorMessage.classList.add("active");
                            }
                        });
                    }
                });
        
            } catch (err) {
                console.error("❌ เกิดข้อผิดพลาด:", err);
                errorMessage.classList.add("active");
                errorMessage.textContent = "ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาต";
            }
        });
        
    </script>
</body>
</html>
