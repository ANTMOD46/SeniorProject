{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สแกนบาร์โค้ด</title>
    <style>
        .scanner-container {
            position: relative;
            max-width: 640px;
            width: 100%;
            height: 360px;
            margin: 0 auto;
            background-color: #f9fafb;
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .error-message {
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    {% include 'accounts/header_logged_in.html' %}

    <div class="pt-20 h-full flex flex-col items-center justify-start bg-gray-50">
        <h1 class="text-4xl font-bold text-gray-900 text-center mb-6">สแกนบาร์โค้ด</h1>
        
        <!-- ปุ่มเปิด/ปิดกล้อง -->
        <button id="startScanner" class="bg-green-500 text-white px-6 py-2 rounded-lg shadow-lg hover:bg-green-600">
            เริ่มสแกนบาร์โค้ด
        </button>

        <!-- กล้องและกรอบ -->
        <div id="scanner-container" class="scanner-container mt-4">
            <video id="video" width="100%" height="100%"></video>
        </div>

        <!-- ข้อความแสดงข้อผิดพลาด -->
        <div id="error-message" class="error-message text-red-500 bg-red-100 border border-red-300 rounded-lg px-4 py-2 mt-4 text-center">
            ไม่สามารถตรวจจับบาร์โค้ดได้ กรุณาลองใหม่อีกครั้ง หรือกรอกรหัสบาร์โค้ดด้านล่าง
        </div>

        <!-- ฟอร์มกรอกรหัสบาร์โค้ด -->
        <form action="{% url 'barcode_scanner:handle_barcode_member' %}" method="GET" class="flex flex-col items-center gap-4 mt-4">
            <input 
                type="text" 
                name="barcode" 
                placeholder="กรอกรหัสบาร์โค้ดที่นี่" 
                class="border border-gray-300 rounded-lg px-4 py-2 text-lg w-64 focus:ring focus:ring-gray-400 focus:outline-none"
                required>
            <button 
                type="submit" 
                class="bg-yellow-500 text-white px-8 py-2 rounded-lg shadow-lg hover:bg-yellow-600 focus:outline-none focus:ring focus:ring-yellow-300">
                ค้นหาบาร์โค้ด
            </button>
        </form>
    </div>

    <script>
        let codeReader = new ZXing.BrowserMultiFormatReader();
        let videoElement = document.getElementById("video");
        let scannerContainer = document.getElementById("scanner-container");
        let startScannerBtn = document.getElementById("startScanner");
        let isScanning = false;

        startScannerBtn.addEventListener("click", function() {
            if (!isScanning) {
                startScannerBtn.textContent = "หยุดสแกน";
                scannerContainer.style.display = "block";
                isScanning = true;

                codeReader.decodeFromVideoDevice(null, videoElement, (result, err) => {
                    if (result) {
                        console.log("บาร์โค้ดที่พบ:", result.text);
                        window.location.href = `/scanner/scan-member/?barcode=${result.text}`;
                        codeReader.reset();
                        isScanning = false;
                        scannerContainer.style.display = "none";
                        startScannerBtn.textContent = "เริ่มสแกนบาร์โค้ด";
                    }
                });
            } else {
                codeReader.reset();
                isScanning = false;
                scannerContainer.style.display = "none";
                startScannerBtn.textContent = "เริ่มสแกนบาร์โค้ด";
            }
        });
    </script>
</body>
</html>
