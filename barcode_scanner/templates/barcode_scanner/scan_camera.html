{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สแกนบาร์โค้ด</title>
    <style>
        .scanner-container {
            position: relative;
            max-width: 640px;
            width: 100%;
            height: 360px;
            margin: 0 auto;
            background-color: #f9fafb;
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            overflow: hidden;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 30%;
            transform: translate(-50%, -50%);
            border: 2px solid #1d4ed8;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(29, 78, 216, 0.5);
        }

        .error-message {
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen">
    {% include 'accounts/header_logged_in.html' %}
    <div class="pt-20 h-full flex flex-col items-center justify-start bg-gray-50">
        <h1 class="text-4xl font-bold text-gray-900 text-center mb-6">สแกนบาร์โค้ด</h1>
        
        <!-- กล้องและกรอบ -->
        <div class="scanner-container mb-6">
            <div id="interactive" class="viewport"></div>
            <div class="scanner-overlay"></div>
        </div>

        <!-- ข้อความแสดงข้อผิดพลาด -->
        <div id="error-message" class="error-message text-red-500 bg-red-100 border border-red-300 rounded-lg px-4 py-2 mt-4 text-center">
            ไม่สามารถตรวจจับบาร์โค้ดได้ กรุณาลองใหม่อีกครั้ง หรือกรอกรหัสบาร์โค้ดด้านล่าง
        </div>

        <!-- ฟอร์มกรอกรหัสบาร์โค้ด -->
        <form action="{% url 'barcode_scanner:handle_barcode_member' %}" method="GET" class="flex flex-col items-center gap-4 mt-4">
            <input 
                type="text" 
                name="barcode" 
                placeholder="กรอกรหัสบาร์โค้ดที่นี่" 
                class="border border-gray-300 rounded-lg px-4 py-2 text-lg w-64 focus:ring focus:ring-gray-400 focus:outline-none"
                required>
            <button 
                type="submit" 
                class="bg-yellow-500 text-white px-8 py-2 rounded-lg shadow-lg hover:bg-yellow-600 focus:outline-none focus:ring focus:ring-yellow-300">
                ค้นหาบาร์โค้ด
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // เริ่มต้น Quagga.js
            Quagga.init({
                inputStream: {
                    type: "LiveStream",
                    constraints: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "environment",
                        aspectRatio: { ideal: 1.7777777778 }
                    }
                },
                decoder: {
                    readers: ["code_128_reader", "ean_reader", "upc_reader"],
                    debug: {
                        drawBoundingBox: true,
                        showFrequency: true,
                        drawScanline: true
                    }
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error("Quagga init error:", err);
                    alert("เกิดข้อผิดพลาดในการสแกน กรุณาลองใหม่");
                    return;
                }
                Quagga.start();
            });

            // ตรวจจับบาร์โค้ด
            Quagga.onDetected(function(data) {
                const barcode = data.codeResult.code;
                console.log("Barcode detected:", barcode);
                window.location.href = `/scanner/scan-member/?barcode=${barcode}`;
                Quagga.stop();
            });

            // ตรวจสอบการประมวลผล
            Quagga.onProcessed(function(result) {
                const errorElement = document.getElementById("error-message");
                const ctx = Quagga.canvas.ctx.overlay;
                const canvas = Quagga.canvas.dom.overlay;

                if (result) {
                    if (result.boxes) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        result.boxes.filter(box => box !== result.box).forEach(box => {
                            Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, ctx, { color: "green", lineWidth: 2 });
                        });
                    }

                    if (result.box) {
                        Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, ctx, { color: "#00F", lineWidth: 2 });
                    }

                    if (result.codeResult && result.codeResult.code) {
                        errorElement.classList.remove("active");
                    } else {
                        errorElement.classList.add("active");
                    }
                } else {
                    errorElement.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
