{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", sans-serif;
        }

        .category-button {
            background-color: #f8fafc;
            padding: 16px 20px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: #1d4ed8;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #d1d5db;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease-in-out;
        }

        .category-button:hover {
            background-color: #e5f3ff;
            color: #1e40af;
            transform: translateY(-3px);
        }

        .category-arrow {
            font-size: 1.5rem;
            color: #2563eb;
        }

        .disabled-button {
            pointer-events: none;
            opacity: 0.6;
        }

        body {
            background-color: #f9fafb;
            padding: 0;
            margin: 0;
        }

        h1 {
            color: #1d4ed8;
            font-size: 2rem;
            font-weight: bold;
        }

        .main-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header-text {
            color: #6b7280;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
    <title>ลงประกาศใหม่</title>
</head>

<body>

    {% include 'accounts/header_logged_in.html' %}

    <!-- Main Content -->
    <main class="main-container">
        <h1 class="text-center">ลงประกาศใหม่</h1>
        <p class="header-text">เลือกหมวดหมู่ที่คุณต้องการ</p>

        <!-- Category Buttons -->
        <div class="space-y-4">
            <a href="{% url 'sell_item' %}" class="category-button">
                ซื้อขายขยะ/ของเก่า
                <span class="category-arrow">&rarr;</span>
            </a>

            <a href="{% url 'donation_form' %}" class="category-button">
                การบริจาค
                <span class="category-arrow">&rarr;</span>
            </a>

            <a href="{% url 'general_announcement' %}" class="category-button">
                กระทู้สอบถามทั่วไป
                <span class="category-arrow">&rarr;</span>
            </a>
        </div>
    </main>

</body>

</html>
