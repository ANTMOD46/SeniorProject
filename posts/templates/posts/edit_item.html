{% load static %}

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }

        /* Adjust the image container margin */
        .image-container {
            margin-bottom: 30px; /* Space below the image to prevent overlap with the form */
        }
    </style>
    <title>แก้ไขโพสต์</title>
</head>

<body class="bg-blue-50"> <!-- เปลี่ยนพื้นหลังให้เป็นฟ้าอ่อน -->
    <!-- รวม header_logged_in.html -->
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-lg mx-auto p-4 mt-10 bg-white shadow-lg rounded-lg relative">
        <h1 class="text-3xl font-bold text-blue-600 mb-4">แก้ไขโพสต์</h1> <!-- เปลี่ยนข้อความหัวเรื่องให้เป็นสีฟ้า -->

        <form action="{% url 'update_item' post_ad.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="image-container">
                {% if post_ad.image %}
                    <img src="{{ post_ad.image.url }}" alt="Product Image" class="w-full h-72 object-cover rounded-md mb-4">
                {% else %}
                    <img src="{% static 'path_to_default_image.jpg' %}" alt="No Product Image" class="w-full h-72 object-cover rounded-md mb-4">
                {% endif %}
            </div>

            <div class="mb-4">
                <label for="title" class="block text-gray-700">ชื่อโพสต์:</label>
                <input type="text" name="title" id="title" value="{{ post_ad.title }}" required class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4" {% if post_ad.post_type == "buy" %}style="display: none;"{% endif %}>
                <label for="price" class="block text-gray-700">ราคา:</label>
                <input type="number" name="price" id="price" value="{{ post_ad.price }}" class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500">
            </div>
            

            <div class="mb-4">
                <label for="description" class="block text-gray-700">รายละเอียด:</label>
                <textarea name="description" id="description" rows="4" required class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500">{{ post_ad.description }}</textarea>
            </div>

            <div class="mb-4">
                <label for="location" class="block text-gray-700">สถานที่:</label>
                <input type="text" name="location" id="location" value="{{ post_ad.location }}" required class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="phone" class="block text-gray-700">เบอร์โทร:</label>
                <input type="text" name="phone" id="phone" value="{{ post_ad.phone }}" required class="w-full px-4 py-2 border border-blue-300 rounded-md focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="image" class="block text-gray-700">อัปโหลดภาพใหม่:</label>
                <input type="file" name="image" id="image" accept="image/*" class="w-full px-4 py-2 border border-blue-300 rounded-md">
            </div>

            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md mt-4">บันทึกการแก้ไข</button> <!-- เปลี่ยนปุ่มให้เป็นสีฟ้า -->
        </form>

        <div class="mt-4">
            <a href="{% url 'sell_item_details' post_ad.id %}" class="text-blue-600">กลับไปยังโพสต์</a> <!-- เปลี่ยนลิงค์ให้เป็นสีฟ้า -->
        </div>
    </main>
    
</body>
</html>
