{% load static %} 

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <title>แก้ไขการบริจาค</title>
    <style>
        * {
            font-family: "Kanit", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100"> <!-- เปลี่ยนพื้นหลังให้เป็นสีเทา -->
    {% include 'accounts/header_logged_in.html' %}

    <main class="flex justify-center items-center min-h-screen mt-6">
        <div class="bg-white w-full max-w-lg p-8 rounded-lg shadow-lg">
            <!-- Header Section -->
            <h1 class="text-3xl font-bold text-gray-700 text-center mb-6">แก้ไขการบริจาค</h1> <!-- ใช้สีเทาสำหรับหัวข้อ -->

            <!-- Form Section -->
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <!-- หัวข้อ -->
                <div>
                    <label for="title" class="block text-gray-700 font-medium mb-2">หัวข้อการบริจาค</label>
                    <input type="text" name="title" id="title" value="{{ donation.title }}" required 
                           placeholder="กรอกหัวข้อการบริจาค" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-500">
                </div>

                <!-- รายละเอียด -->
                <div>
                    <label for="description" class="block text-gray-700 font-medium mb-2">รายละเอียด</label>
                    <textarea name="description" id="description" rows="4" required 
                              placeholder="กรอกรายละเอียดของการบริจาค"
                              class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-500 resize-none">{{ donation.description }}</textarea>
                </div>

                <!-- สถานที่ -->
                <div>
                    <label for="location" class="block text-gray-700 font-medium mb-2">สถานที่</label>
                    <input type="text" name="location" id="location" value="{{ donation.location }}" required 
                           placeholder="กรอกสถานที่"
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-500">
                </div>

                <!-- เบอร์โทร -->
                <div>
                    <label for="phone" class="block text-gray-700 font-medium mb-2">เบอร์โทร</label>
                    <input type="text" name="phone" id="phone" value="{{ donation.phone }}" required 
                           placeholder="กรอกเบอร์โทรศัพท์"
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-500">
                </div>

                <!-- รูปภาพ -->
                <div>
                    <label for="image" class="block text-gray-700 font-medium mb-2">รูปภาพ</label>
                    <div class="relative w-full h-40 flex justify-center items-center border-2 border-dashed border-gray-300 rounded-md bg-gray-50 cursor-pointer">
                        <label for="image" id="image-preview-container" class="absolute inset-0 flex flex-col justify-center items-center cursor-pointer">
                            {% if donation.image %}
                            <img id="image-preview" src="{{ donation.image.url }}" alt="ภาพการบริจาค"
                                 class="w-full h-full object-cover rounded-md">
                            {% else %}
                            <svg id="upload-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="text-gray-400">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span id="upload-text" class="mt-2 text-sm text-gray-400">คลิกเพื่ออัปโหลดรูปภาพ</span>
                            {% endif %}
                        </label>
                        <input type="file" id="image" name="image" class="hidden" accept="image/*" onchange="previewSelectedImage(event)">
                    </div>
                </div>

                <!-- ปุ่ม -->
                <div class="flex justify-between items-center mt-6">
                    <button type="submit" 
                            class="py-3 px-6 bg-gray-600 text-white font-medium rounded-md shadow hover:bg-gray-700 focus:ring-2 focus:ring-gray-500 focus:outline-none">
                        บันทึกการแก้ไข
                    </button>
                    <a href="{% url 'donation_details' donation.id %}" 
                       class="text-gray-600 font-medium hover:underline focus:outline-none transition-all">
                        ยกเลิก
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>

<script>
    function previewSelectedImage(event) {
        const file = event.target.files[0];
        const imagePreview = document.getElementById('image-preview');
        const uploadIcon = document.getElementById('upload-icon');
        const uploadText = document.getElementById('upload-text');
        const imagePreviewContainer = document.getElementById('image-preview-container');

        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                if (!imagePreview) {
                    const imgElement = document.createElement('img');
                    imgElement.id = 'image-preview';
                    imgElement.src = e.target.result;
                    imgElement.className = 'w-full h-full object-cover rounded-md';
                    imagePreviewContainer.appendChild(imgElement);
                } else {
                    imagePreview.src = e.target.result;
                }

                if (uploadIcon) uploadIcon.style.display = 'none';
                if (uploadText) uploadText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }
</script>

</html>
