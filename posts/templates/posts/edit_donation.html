{% load static %} 

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }

        .image-container {
            margin-bottom: 30px; 
        }
    </style>
    <title>แก้ไขการบริจาค</title>
</head>

<body class="bg-pink-50">
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-lg mx-auto p-4 mt-10 bg-white shadow-lg rounded-lg relative">
        <h1 class="text-3xl font-bold text-pink-600 mb-4">แก้ไขการบริจาค</h1>

        <form action="{% url 'update_donation' donation.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% if donation.image %}
                <div class="image-container">
                    <img src="{{ donation.image.url }}" alt="ภาพการบริจาค" class="w-full h-72 object-cover rounded-md mb-4">
                </div>
            {% else %}
                <div class="image-container">
                    <img src="{% static 'images/default_image.jpg' %}" alt="ไม่มีภาพ" class="w-full h-72 object-cover rounded-md mb-4">
                </div>
            {% endif %}

            <div class="mb-4">
                <label for="title" class="block text-gray-700">หัวข้อการบริจาค:</label>
                <input type="text" name="title" id="title" value="{{ donation.title }}" required 
                       placeholder="กรอกหัวข้อการบริจาค" 
                       class="w-full px-4 py-2 border border-pink-300 rounded-md focus:ring-2 focus:ring-pink-500">
            </div>

            <div class="mb-4">
                <label for="description" class="block text-gray-700">รายละเอียด:</label>
                <textarea name="description" id="description" rows="4" required 
                          placeholder="กรอกรายละเอียดของการบริจาค"
                          class="w-full px-4 py-2 border border-pink-300 rounded-md focus:ring-2 focus:ring-pink-500">{{ donation.description }}</textarea>
            </div>

            <div class="mb-4">
                <label for="location" class="block text-gray-700">สถานที่:</label>
                <input type="text" name="location" id="location" value="{{ donation.location }}" required 
                       placeholder="กรอกสถานที่"
                       class="w-full px-4 py-2 border border-pink-300 rounded-md focus:ring-2 focus:ring-pink-500">
            </div>

            <div class="mb-4">
                <label for="phone" class="block text-gray-700">เบอร์โทร:</label>
                <input type="text" name="phone" id="phone" value="{{ donation.phone }}" required 
                       placeholder="กรอกเบอร์โทรศัพท์"
                       class="w-full px-4 py-2 border border-pink-300 rounded-md focus:ring-2 focus:ring-pink-500">
            </div>

            <div class="mb-4">
                <label for="image" class="block text-gray-700">อัปโหลดภาพใหม่:</label>
                <input type="file" name="image" id="image" accept="image/*" 
                       class="w-full px-4 py-2 border border-pink-300 rounded-md">
            </div>

            <div class="flex justify-between items-center mt-6">
                <button type="submit" 
                        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md">
                    บันทึกการแก้ไข
                </button>
                <a href="{% url 'donation_details' donation.id %}" class="text-blue-600">กลับไปยังโพสต์</a>
            </div>

        </form>
    </main>
</body>

</html>
