{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }

        .form-container {
            background-color: #ffffff; /* พื้นหลังสีขาว */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            color: #1e40af; /* สีฟ้าสำหรับข้อความ */
        }

        .form-input {
            border: 1px solid #93c5fd; /* สีฟ้าสำหรับเส้นขอบ */
            background-color: #f0f9ff; /* สีฟ้าจาง */
            transition: all 0.3s ease-in-out;
        }

        .form-input:focus {
            border-color: #2563eb; /* ขอบสีฟ้าเข้มเมื่อโฟกัส */
            outline: none;
            box-shadow: 0 0 4px rgba(37, 99, 235, 0.5);
        }

        .submit-button {
            background-color: #2563eb; /* ปุ่มสีฟ้าเข้ม */
            color: white;
            transition: background-color 0.3s ease-in-out;
        }

        .submit-button:hover {
            background-color: #1d4ed8; /* สีฟ้าเข้มขึ้นเมื่อ hover */
        }
    </style>
    <title>ลงประกาศการบริจาค</title>
</head>

<body class="bg-gray-100">
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-4xl mx-auto p-6 mt-10">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-6">ลงประกาศการบริจาค</h1>

        <div class="form-container">
            <form action="{% url 'donation_form' %}" method="POST" class="space-y-6" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- ฟิลด์ตัวเลือกประเภทผู้บริจาคหรือผู้รับบริจาค -->
                <div>
                    <label for="role" class="form-label block text-lg font-semibold mb-1">ประเภทผู้ใช้*</label>
                    <select id="role" name="role" class="form-input w-full px-4 py-2 rounded-md" required>
                        <option value="" disabled selected>เลือก...</option>
                        <option value="donor">ผู้บริจาค</option>
                        <option value="recipient">ผู้รับบริจาค</option>
                    </select>
                </div>

                <div>
                    <label for="title" class="form-label block text-lg font-semibold mb-1">หัวข้อการบริจาค*</label>
                    <input type="text" id="title" name="title" class="form-input w-full px-4 py-2 rounded-md" placeholder="ชื่อการบริจาค เช่น เสื้อผ้า หนังสือ" required>
                </div>

                <div>
                    <label for="description" class="form-label block text-lg font-semibold mb-1">รายละเอียดการบริจาค*</label>
                    <textarea id="description" name="description" rows="4" class="form-input w-full px-4 py-2 rounded-md" placeholder="รายละเอียดเพิ่มเติม" required></textarea>
                </div>

                <div>
                    <label for="location" class="form-label block text-lg font-semibold mb-1">สถานที่*</label>
                    <input type="text" id="location" name="location" class="form-input w-full px-4 py-2 rounded-md" placeholder="ที่อยู่ จังหวัด อำเภอ" required>
                </div>

                <div>
                    <label for="phone" class="form-label block text-lg font-semibold mb-1">เบอร์โทรศัพท์ติดต่อ*</label>
                    <input type="text" id="phone" name="phone" class="form-input w-full px-4 py-2 rounded-md" placeholder="เช่น 09xxxxxxxx" required>
                </div>

                <div>
                    <label for="image" class="form-label block text-lg font-semibold mb-1">รูปภาพ*</label>
                    <input type="file" id="image" name="image" class="form-input w-full px-4 py-2 rounded-md" required>
                    <p class="text-sm text-gray-500 mt-1">เพิ่มรูปภาพ</p>
                </div>

                <div class="text-center">
                    <button type="submit" class="submit-button font-bold py-2 px-8 rounded-md">ลงประกาศ</button>
                    <a href="{% url 'post_ad' %}" class="cancel-link ml-4">ยกเลิก</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
