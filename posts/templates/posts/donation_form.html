{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }

        .form-container {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd); /* ไล่สีฟ้า */
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.2); /* เพิ่มเงาสีน้ำเงิน */
            animation: fadeIn 0.5s ease-in-out;
        }

        .form-label {
            color: #2563eb; /* สีฟ้าสำหรับข้อความ */
            font-weight: 600;
        }

        .form-input {
            border: 2px solid #93c5fd; /* สีฟ้าสำหรับเส้นขอบ */
            background-color: #f0f9ff; /* สีฟ้าจาง */
            transition: all 0.3s ease-in-out;
        }

        .form-input:focus {
            border-color: #2563eb; /* ขอบสีฟ้าเข้มเมื่อโฟกัส */
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.5); /* เพิ่มเงา */
            outline: none;
        }

        .submit-button {
            background-color: #2563eb; /* สีฟ้า */
            color: white;
            transition: all 0.3s ease-in-out;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); /* เพิ่มเงา */
        }

        .submit-button:hover {
            background-color: #1d4ed8; /* สีฟ้าเข้มขึ้น */
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.5); /* เพิ่มเงา */
            transform: scale(1.05);
        }

        .cancel-link {
            color: #2563eb; /* สีฟ้าสำหรับลิงก์ */
            font-weight: 600;
            text-decoration: underline;
            transition: color 0.3s ease-in-out;
        }

        .cancel-link:hover {
            color: #1d4ed8; /* สีฟ้าเข้มขึ้นเมื่อ hover */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <title>ลงประกาศการบริจาค</title>
</head>

<body class="bg-blue-50"> <!-- พื้นหลังสีฟ้าอ่อน -->
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-4xl mx-auto p-6 mt-10">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-6">ลงประกาศการบริจาค</h1>

        <div class="form-container">
            <form action="{% url 'donation_form' %}" method="POST" class="space-y-6" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- ฟิลด์ตัวเลือกประเภทผู้บริจาคหรือผู้รับบริจาค -->
                <div>
                    <label for="role" class="form-label block text-lg mb-1">ประเภทผู้ใช้*</label>
                    <select id="role" name="role" class="form-input w-full px-4 py-3 rounded-md" required>
                        <option value="" disabled selected>เลือก...</option>
                        <option value="donor">ผู้บริจาค</option>
                        <option value="recipient">ผู้รับบริจาค</option>
                    </select>
                </div>

                <div>
                    <label for="title" class="form-label block text-lg mb-1">หัวข้อการบริจาค*</label>
                    <input type="text" id="title" name="title" class="form-input w-full px-4 py-3 rounded-md" placeholder="ชื่อการบริจาค เช่น เสื้อผ้า หนังสือ" required>
                </div>

                <div>
                    <label for="description" class="form-label block text-lg mb-1">รายละเอียดการบริจาค*</label>
                    <textarea id="description" name="description" rows="4" class="form-input w-full px-4 py-3 rounded-md" placeholder="รายละเอียดเพิ่มเติม" required></textarea>
                </div>

                <div>
                    <label for="location" class="form-label block text-lg mb-1">สถานที่*</label>
                    <input type="text" id="location" name="location" class="form-input w-full px-4 py-3 rounded-md" placeholder="ที่อยู่ จังหวัด อำเภอ" required>
                </div>

                <div>
                    <label for="phone" class="form-label block text-lg mb-1">เบอร์โทรศัพท์ติดต่อ*</label>
                    <input type="text" id="phone" name="phone" class="form-input w-full px-4 py-3 rounded-md" placeholder="เช่น 09xxxxxxxx" required>
                </div>

                <div>
                    <label for="image" class="form-label block text-lg mb-1">รูปภาพ*</label>
                    <input type="file" id="image" name="image" class="form-input w-full px-4 py-3 rounded-md" required>
                    <p class="text-sm text-gray-500 mt-1">เพิ่มรูปภาพ</p>
                </div>

                <div class="text-center">
                    <button type="submit" class="submit-button">ลงประกาศ</button>
                    <a href="{% url 'post_ad' %}" class="cancel-link ml-4">ยกเลิก</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
