{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <title>ลงประกาศสินค้า</title>
</head>

<body class="bg-gray-100 font-sans">
    {% include 'accounts/header_logged_in.html' %}

    <main class="flex justify-center items-center min-h-screen mt-6">
        <div class="bg-white w-full max-w-lg p-8 pt-10 rounded-lg shadow-lg">
            <!-- Header Section -->
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">ลงประกาศสินค้า</h1>

            <!-- Form Section -->
            <form action="{% url 'sell_item' %}" method="POST" class="space-y-6" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- ประเภทประกาศ -->
                <div>
                    <label for="post_type" class="block text-gray-700 font-medium mb-2">ประเภทประกาศ*</label>
                    <select id="post_type" name="post_type" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="" disabled selected>เลือกประเภทประกาศ...</option>
                        <option value="sell">ประกาศขาย</option>
                        <option value="buy">ประกาศซื้อ</option>
                    </select>
                </div>

                <!-- หัวข้อประกาศ -->
                <div>
                    <label for="title" class="block text-gray-700 font-medium mb-2">หัวข้อประกาศ</label>
                    <input type="text" id="title" name="title" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="ชื่อสินค้า เช่น ขวดพลาสติก เหล็ก" required>
                </div>

                <!-- ราคาสำหรับประกาศขาย -->
                <div id="price-container" class="hidden">
                    <label for="price" class="block text-gray-700 font-medium mb-2">ระบุราคาที่คาดหวัง</label>
                    <input type="number" id="price" name="price"
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="ระบุราคาเป็นตัวเลข เช่น 100">
                </div>

                <!-- รูปภาพสินค้า -->
                <div>
                    <label for="image" class="block text-gray-700 font-medium mb-2">เพิ่มรูปภาพสินค้า</label>
                    <div class="relative w-full h-40 flex justify-center items-center border-2 border-dashed border-gray-300 rounded-md p-4 bg-gray-50 cursor-pointer">
                        <label for="image" id="image-preview-container" class="absolute inset-0 flex flex-col justify-center items-center cursor-pointer">
                            <svg id="upload-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm1 10l3-3 2 2 4-4 3 3v3H5v-1zm2-4a2 2 0 110-4 2 2 0 010 4z" />
                            </svg>
                            <span id="upload-text" class="mt-2 text-sm text-gray-500">คลิกเพื่อเพิ่มรูปภาพสินค้า</span>
                        </label>
                        <input type="file" id="image" name="image" class="hidden" onchange="previewSelectedImage(event)" required>
                    </div>
                </div>

                <!-- รายละเอียดสินค้า -->
                <div>
                    <label for="description" class="block text-gray-700 font-medium mb-2">รายละเอียดสินค้า</label>
                    <textarea id="description" name="description" rows="4" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                        placeholder="ข้อมูลเพิ่มเติมที่ทำให้สินค้าของคุณได้แสดงรายละเอียด" required></textarea>
                </div>
                
                <!-- พื้นที่สินค้า -->
                <div>
                    <label for="location" class="block text-gray-700 font-medium mb-2">พื้นที่สินค้า</label>
                    <input type="text" id="location" name="location" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="ระบุที่อยู่ จังหวัด อำเภอ" required>
                </div>

                <!-- เบอร์โทรติดต่อ -->
                <div>
                    <label for="phone" class="block text-gray-700 font-medium mb-2">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="text" id="phone" name="phone" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="เช่น 09xxxxxxxx" required>
                </div>

                <!-- ปุ่มส่งฟอร์ม -->
                <div class="flex justify-between items-center mt-4">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md shadow-md hover:bg-blue-500 focus:ring-2 focus:ring-blue-400 transition-all">ลงประกาศ</button>
                    <a href="{% url 'post_ad' %}" class="text-blue-600 font-medium hover:underline">ยกเลิก</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        // แสดงหรือซ่อนฟิลด์ราคา
        const postTypeSelect = document.getElementById('post_type');
        const priceContainer = document.getElementById('price-container');

        postTypeSelect.addEventListener('change', () => {
            if (postTypeSelect.value === 'sell') {
                priceContainer.classList.remove('hidden');
            } else {
                priceContainer.classList.add('hidden');
            }
        });

        // แสดงตัวอย่างรูปภาพที่อัปโหลด
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const imagePreviewContainer = document.getElementById('image-preview-container');
            const uploadIcon = document.getElementById('upload-icon');
            const uploadText = document.getElementById('upload-text');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    let imgElement = imagePreviewContainer.querySelector('img');
                    if (!imgElement) {
                        imgElement = document.createElement('img');
                        imgElement.className = 'w-full h-full object-cover rounded-md';
                        imagePreviewContainer.appendChild(imgElement);
                    }
                    imgElement.src = e.target.result;
                    uploadIcon.style.display = 'none';
                    uploadText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
