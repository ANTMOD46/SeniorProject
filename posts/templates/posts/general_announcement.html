{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Kanit", serif;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .show {
            display: block;
        }
    </style>
    <title>ลงประกาศใหม่</title>
</head>

<body class="bg-pink-50">
    {% include 'accounts/header_logged_in.html' %}
    
    <main class="max-w-lg mx-auto mt-10 p-6 bg-white rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-pink-600 mb-6 text-center">สร้างกระทู้ใหม่</h1>
        <p class="text-center text-gray-600 mb-4">แสดงความคิดเห็นหรือสอบถามเรื่องราวที่คุณสนใจ</p>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="mb-6">
                <label for="title" class="block text-lg font-semibold text-gray-700 mb-2">หัวข้อการประกาศ*</label>
                <input type="text" name="title" id="title" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" placeholder="เช่น: อยากขายขวดพลาสติก" required>
            </div>

            <div class="mb-6">
                <label for="description" class="block text-lg font-semibold text-gray-700 mb-2">รายละเอียด*</label>
                <textarea name="content" id="description" rows="4" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" placeholder="ระบุรายละเอียดเกี่ยวกับสิ่งที่คุณต้องการประกาศ" required></textarea>
            </div>

            <div class="mb-6">
                <label for="location" class="block text-lg font-semibold text-gray-700 mb-2">ระบุพื้นที่*</label>
                <input type="text" name="location" id="location" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-pink-500" placeholder="เช่น: กรุงเทพมหานคร" required>
            </div>

            <div>
                <label for="images" class="block text-lg font-semibold text-pink-600 mb-1">เพิ่มรูปภาพ*</label>
                <input type="file" id="images" name="image" class="w-full px-4 py-2 border border-pink-300 rounded-md bg-pink-50" required>

                <p class="text-sm text-gray-500 mt-1">เพิ่มรูปภาพได้ไม่เกิน 10 ภาพ</p>
            </div>

            <div class="text-center">
                <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-8 rounded-md">ลงประกาศ</button>
                <a href="{% url 'home' %}" class="ml-4 text-gray-600 hover:underline">ยกเลิก</a>
            </div>
        </form>
    </main>

    <script>
        const hamburgerButton = document.getElementById('hamburgerButton');
        const dropdownMenu = document.getElementById('dropdownMenu');

        hamburgerButton.addEventListener('click', () => {
            dropdownMenu.classList.toggle('show');
        });

        window.addEventListener('click', (event) => {
            if (!hamburgerButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.remove('show');
            }
        });
    </script>

</body>
</html>
