{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สร้างกระทู้ใหม่</title>
</head>

<body class="bg-gray-100 font-sans">
    {% include 'accounts/header_logged_in.html' %}

    <main class="flex justify-center items-center min-h-screen sm:mt-12 md:mt-16 lg:mt-20 ">
        <div class="bg-white w-full max-w-lg md:max-w-xl lg:max-w-2xl p-8 pt-10 rounded-xl shadow-2xl">
            <!-- Header Section -->
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">สร้างกระทู้ใหม่</h1>
            <p class="text-center text-gray-600 mb-6">แสดงความคิดเห็นหรือสอบถามเรื่องราวที่คุณสนใจ</p>

            <!-- Form Section -->
            <form action="{% url 'general_announcement' %}" method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <!-- หัวข้อการประกาศ -->
                <div>
                    <label for="title" class="block text-gray-700 font-medium mb-2">หัวข้อการประกาศ*</label>
                    <input type="text" name="title" id="title"
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="เช่น: อยากขายขวดพลาสติก" required>
                </div>

                <!-- รายละเอียด -->
                <div>
                    <label for="description" class="block text-gray-700 font-medium mb-2">รายละเอียด*</label>
                    <textarea name="content" id="description" rows="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                        placeholder="ระบุรายละเอียดเกี่ยวกับสิ่งที่คุณต้องการประกาศ" required></textarea>
                </div>

                <!-- ระบุพื้นที่ -->
                <div>
                    <label for="location" class="block text-gray-700 font-medium mb-2">ระบุพื้นที่*</label>
                    <input type="text" name="location" id="location"
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="เช่น: กรุงเทพมหานคร" required>
                </div>

                <!-- เพิ่มรูปภาพ -->
                <div>
                    <label for="images" class="block text-gray-700 font-medium mb-2">เพิ่มรูปภาพ*</label>
                    <div
                        class="relative w-full h-40 flex justify-center items-center border-2 border-dashed border-gray-300 rounded-md bg-gray-50 cursor-pointer">
                        <label for="images" id="image-preview-container"
                            class="absolute inset-0 flex flex-col justify-center items-center cursor-pointer">
                            <svg id="upload-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-500"
                                viewBox="0 0 20 20" fill="currentColor">
                                <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm1 10l3-3 2 2 4-4 3 3v3H5v-1zm2-4a2 2 0 110-4 2 2 0 010 4z" />
                            </svg>
                            <span id="upload-text" class="text-sm text-gray-500 mt-2">คลิกเพื่อเพิ่มรูปภาพ</span>
                        </label>
                        <input type="file" id="images" name="image" class="hidden" onchange="previewSelectedImage(event)" required>
                    </div>
                </div>

                <!-- ปุ่มส่งฟอร์ม -->
                <div class="flex flex-wrap sm:flex-nowrap justify-between items-center mt-4 gap-4">
                    <button type="submit"
                        class="bg-purple-600 text-white px-6 py-3 w-full sm:w-auto rounded-lg shadow-lg hover:bg-green-500 transition-all duration-300 transform hover:scale-105 focus:ring-2 focus:ring-blue-400">
                        ลงประกาศกระทู้
                    </button>
                    <a href="{% url 'post_ad' %}"class="text-red-600 font-medium hover:underline mt-2 sm:mt-0">ยกเลิก</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const imagePreviewContainer = document.getElementById('image-preview-container');
            const uploadIcon = document.getElementById('upload-icon');
            const uploadText = document.getElementById('upload-text');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    let imgElement = imagePreviewContainer.querySelector('img');
                    if (!imgElement) {
                        imgElement = document.createElement('img');
                        imgElement.className = 'w-full h-full object-cover rounded-md';
                        imagePreviewContainer.appendChild(imgElement);
                    }
                    imgElement.src = e.target.result;
                    uploadIcon.style.display = 'none';
                    uploadText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
