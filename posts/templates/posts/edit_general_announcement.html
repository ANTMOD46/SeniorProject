{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <title>แก้ไขประกาศ</title>
    <style>
        * {
            font-family: "Kanit", serif;
        }
    </style>
</head>

<body class="bg-blue-50"> <!-- เปลี่ยนพื้นหลังเป็นสีฟ้าอ่อน -->
    {% include 'accounts/header_logged_in.html' %}

    <main class="max-w-lg mx-auto p-4 mt-10 bg-white shadow-lg rounded-lg">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">แก้ไขประกาศ</h1> <!-- เปลี่ยนหัวข้อเป็นสีฟ้า -->

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <!-- ฟิลด์สำหรับหัวข้อการประกาศ -->
            <div class="mb-6">
                <label for="title" class="block text-lg font-semibold text-gray-700 mb-2">หัวข้อการประกาศ</label>
                <input type="text" name="title" value="{{ form.title.value }}" class="w-full px-4 py-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500"> <!-- เปลี่ยนขอบเป็นฟ้า -->
                {{ form.title.errors }}
            </div>

            <!-- ฟิลด์สำหรับเนื้อหาของประกาศ -->
            <div class="mb-6">
                <label for="content" class="block text-lg font-semibold text-gray-700 mb-2">รายละเอียดประกาศ</label>
                <textarea name="content" rows="4" class="w-full px-4 py-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500">{{ form.content.value }}</textarea> <!-- เปลี่ยนขอบเป็นฟ้า -->
                {{ form.content.errors }}
            </div>

            <!-- ฟิลด์สำหรับสถานที่ -->
            <div class="mb-6">
                <label for="location" class="block text-lg font-semibold text-gray-700 mb-2">สถานที่</label>
                <input type="text" name="location" value="{{ form.location.value }}" class="w-full px-4 py-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500"> <!-- เปลี่ยนขอบเป็นฟ้า -->
                {{ form.location.errors }}
            </div>

            <!-- ฟิลด์สำหรับรูปภาพ -->
            <div class="mb-6">
                <label for="image" class="block text-lg font-semibold text-gray-700 mb-2">รูปภาพ</label>
                <input type="file" name="image" class="w-full px-4 py-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500"> <!-- เปลี่ยนขอบเป็นฟ้า -->
                {% if announcement.image %}
                    <img src="{{ announcement.image.url }}" alt="ประกาศ" class="w-full h-48 object-cover mt-2">
                {% endif %}
                {{ form.image.errors }}
            </div>

            <div class="text-center">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-8 rounded-md">บันทึกการแก้ไข</button> <!-- เปลี่ยนปุ่มเป็นฟ้า -->
            </div>
        </form>
    </main>
</body>

</html>
