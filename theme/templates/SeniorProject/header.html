{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: "Lora", serif;
            font-optical-sizing: auto;
            font-style: normal;
        }

        .logo-img {
            width: 60px;
            height: auto;
        }

        .nav-buttons a {
            padding: 0.625rem 1.25rem;
        }

        .nav-buttons a.signup {
            background-color: #34d399;
        }

        .nav-buttons a.signup:hover {
            background-color: #059669;
        }

        .nav-buttons a.login {
            background-color: #3b82f6;
        }

        .nav-buttons a.login:hover {
            background-color: #2563eb;
        }

        @media (min-width: 768px) {
            .logo-img {
                width: 80px;
            }

            .nav-buttons a {
                padding: 0.75rem 1.5rem;
            }
        }
    </style>
    <title>รักษาโลกให้สะอาดและแบ่งปัน</title>
</head>

<body class="bg-gray-50 overflow-x-hidden">
    <!-- Header -->
    <header class="fixed w-full bg-white border-b border-gray-200 shadow-md z-50">
        <div class="flex items-center justify-between max-w-screen-xl mx-auto px-6 py-3">
            <!-- Left Section (Logo) -->
            <div class="flex items-center">
                <img class="logo-img object-cover rounded-full" src="{% static 'css/dist/Seniorproject/img/logo.png' %}" alt="Logo">
            </div>
            <!-- Right Section (Buttons) -->
            <div class="flex items-center space-x-4 nav-buttons">
                <!-- Signup Button -->
                <a href="{% url 'signup' %}" 
                   class="text-white signup focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-full text-sm px-6 py-2.5 shadow-md">
                   สมัครสมาชิก
                </a>
                <!-- Login Button -->
                <a href="{% url 'login' %}" 
                   class="text-white login focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-6 py-2.5 shadow-md">
                   เข้าสู่ระบบ
                </a>
            </div>
        </div>
    </header>
</body>
</html>
