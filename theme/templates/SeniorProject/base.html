{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="theme-color" content="#1bb566">
    <title>Keep the world clean and share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="{% static 'css/dist/Seniorproject/img/logo.png' %}" type="image/png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Lora", serif;
            font-optical-sizing: auto;
            font-style: normal;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen overflow-x-hidden">
    {% include 'Seniorproject/header.html' %}  <!-- แก้ไขเส้นทางให้ตรงกับที่จัดโครงสร้าง -->
    <main class="flex flex-col grow bg-white">
        {% block main %}
        {% endblock %}
    </main>
</body>
</html>
