{% extends 'Seniorproject/base.html' %}

{% block main %}
<!-- Main Image responsive with Swiper -->
<div class="swiper-container mySwiper mt-28">
    <div class="swiper-wrapper">
        <!-- Slide 1 -->
        <div class="swiper-slide">
            <img src="https://s359.kapook.com/pagebuilder/54ddd684-5b71-43c4-b093-51c7d128e93e.jpg" 
                 class="rounded-lg w-full h-96 object-contain" alt="Image 1">
        </div>
        <!-- Slide 2 -->
        <div class="swiper-slide">
            <img src="https://s3.ap-southeast-1.amazonaws.com/members.project.cover/ee8604c4-5d22-475f-af67-61dcfab023df/eacbd98c-11f1-4775-b184-19cff7bab344.jpg" 
                 class="rounded-lg w-full h-96 object-contain" alt="Image 2">
        </div>
        <!-- Slide 3 -->
        <div class="swiper-slide">
            <img src="https://png.pngtree.com/background/20210710/original/pngtree-garbage-classification-green-travel-minimalist-background-picture-image_1062842.jpg" 
                 class="rounded-lg w-full h-96 object-contain" alt="Image 3">
        </div>
    </div>
    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
</div>

<!-- Main content -->
<main class="p-4 text-center flex-grow">
    <h2 class="text-red-600 text-4xl font-semibold mt-3">
        ยินดีต้อนรับเข้าสู่ Keep the world clean and share (รักษาโลกให้สะอาดและแบ่งปัน)
    </h2>
    
    
    
</main>

<!-- Scrollable Image Slider Section -->
<section class="mt-6 overflow-x-auto">
    <div class="flex justify-center space-x-12">
        <!-- การแยกขยะ -->
        <div class="min-w-max text-center">
            <img src="https://www.japankakkoii.com/wp-content/uploads/2023/03/Pyake-Introduction-1.jpg"
                 alt="การแยกขยะ" class="rounded-lg w-60 h-60 object-cover hover:scale-105 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-pink-600">การแยกขยะ</p>
        </div>
        <!-- การซื้อ-ขายขยะ -->
        <div class="min-w-max text-center">
            <img src="https://www.kudjub.go.th/images/com_droppics/178/large/DSC2834.JPG"
                 alt="การซื้อ-ขายขยะ" class="rounded-lg w-60 h-60 object-cover hover:scale-105 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-pink-600">การซื้อ-ขายขยะ</p>
        </div>
        <!-- การบริจาค -->
        <div class="min-w-max text-center">
            <img src="https://pnkaccount.co.th/storage/2020/09/%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%9A%E0%B8%A3%E0%B8%B4%E0%B8%88%E0%B8%B2%E0%B8%84.jpg" 
                 alt="การบริจาค" class="rounded-lg w-60 h-60 object-cover hover:scale-105 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-pink-600">การบริจาค</p>
        </div>
    </div>
</section>

<!-- Image Section for Waste Types (bins) -->
<section class="mt-6 flex justify-center space-x-4">
    <div class="text-center hover:bg-blue-50 rounded-lg transition duration-300 ease-in-out cursor-pointer p-4">
        <a href="{% url 'recycle' %}">
            <img src="https://www.dohome.co.th/media/catalog/product/cache/e446f15aaa8dc66b80b7a0df334f7c5a/1/0/10385946_zwf_p1.jpg"
                 alt="Recycle Bin" class="rounded-lg w-48 h-48 object-cover hover:scale-110 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-yellow-600">ขยะรีไซเคิล</p>
        </a>
    </div>
    <div class="text-center hover:bg-blue-50 rounded-lg transition duration-300 ease-in-out cursor-pointer p-4">
        <a href="{% url 'organic' %}">
            <img src="https://www.dohome.co.th/media/catalog/product/cache/e446f15aaa8dc66b80b7a0df334f7c5a/1/0/10385945_zwf_p1.jpg"
                 alt="Organic Bin" class="rounded-lg w-48 h-48 object-cover hover:scale-110 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-green-600">ขยะเปียก</p>
        </a>
    </div>

    <div class="text-center hover:bg-blue-50 rounded-lg transition duration-300 ease-in-out cursor-pointer p-4">
        <a href="{% url 'general' %}">
            <img src="https://www.dohome.co.th/media/catalog/product/cache/e446f15aaa8dc66b80b7a0df334f7c5a/1/0/10385944_zwf_p1.jpg" 
                 alt="General Waste Bin" class="rounded-lg w-48 h-48 object-cover hover:scale-110 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-blue-600">ขยะทั่วไป</p>
        </a>
    </div>

    <div class="text-center hover:bg-blue-50 rounded-lg transition duration-300 ease-in-out cursor-pointer p-4">
        <a href="{% url 'hazardous' %}">
            <img src="https://www.dohome.co.th/media/catalog/product/cache/e446f15aaa8dc66b80b7a0df334f7c5a/1/0/10385974_zwf_p1.jpg"
                 alt="Hazardous Bin" class="rounded-lg w-48 h-48 object-cover hover:scale-110 transition duration-300 ease-in-out">
            <p class="mt-2 text-lg md:text-xl font-bold text-red-600">ขยะอันตราย</p>
        </a>
    </div>
</section>

<!-- Button for QR Scanning -->
<section class="mt-6 text-center">
    <button 
    onclick="window.location.href='/scanner/scan-camera-guest/'" 
    class="bg-pink-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-md text-lg">
    ดูการแยกขยะได้ตรงนี้
</button>

</section>

{% endblock main %}
