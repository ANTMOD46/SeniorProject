{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>สร้างห้องแชทใหม่</title>
</head>
<body class="bg-blue-50">

    {% include 'accounts/header_logged_in.html' %}

    <div class="p-10 lg:p-20 text-center bg-blue-100 rounded-lg shadow-lg mb-10">
        <h1 class="text-4xl lg:text-6xl text-blue-900 font-semibold">สร้างห้องแชทใหม่</h1>
    </div>

    <div class="lg:w-2/4 mx-auto p-4 bg-white rounded-xl shadow-md">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="block text-lg font-medium text-blue-600">ชื่อห้องแชท</label>
                <input type="text" name="name" id="name" class="w-full p-3 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="พิมพ์ชื่อห้องแชท" required>
            </div>
            <button type="submit" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none">สร้างห้อง</button>
        </form>
    </div>

</body>
</html>
